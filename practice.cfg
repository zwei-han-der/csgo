echo "Applying practice config..."
echo ""

// [Server commands]
sv_cheats "1"
bot_kick
mp_limitteams "0"
mp_autoteambalance "0"

// [Round configuration]
mp_timelimit "0"
mp_roundtime "60"
mp_roundtime_hostage "60"
mp_roundtime_defuse "60"
mp_freezetime "0"
mp_warmup_end
mp_halftime "0"
mp_halftime_duration "0"
mp_round_restart_delay "1"
mp_match_end_restart "1"
mp_match_restart_delay "3"
mp_maxrounds "9999"

// [Ammo configuration]
ammo_grenade_limit_total "5"
sv_infinite_ammo "1"

// [Buy and Money configuration]
mp_maxmoney "9999"
mp_startmoney "9999"
mp_buytime "9999"
mp_buy_anywhere "1"
mp_items_prohibited "0"

// [Drop configuration]
mp_drop_knife_enable "1"
mp_drop_grenade_enable "1"
mp_anyone_can_pickup_c4 "1"

// [Grenade practice]
sv_grenade_trajectory "1"
sv_grenade_trajectory_time "10s"

[Spray practice]
sv_showimpacts "1"
sv_showimpacts_time "5s"

// [Binds]
bind "c" "sv_rethrow_last_grenade"
echo "[BIND APLLIED] Press C to rethrow last grenade"
bind "v" "give weapon_incgrenade;give weapon_flashbang;give weapon_smokegrenade;give weapon_molotov;give weapon_decoy;give weapon_hegrenade"
echo "[BIND APLLIED] Press V to buy all grenade"
bind "MOUSE5" "noclip"
echo "[BIND APLLIED] Press MOUSE 5 to activate noclip"
echo ""

// [Aliases]
alias "disable grenade practice" "sv_grenade_trajectory 0"
alias "disable spray practice" "sv_showimpacts 0"
alias "disable infinite ammo" "sv_infinite_ammo 0"
alias "enable bhop" "sv_autobunnyhopping 1"
alias "disable bhop" "sv_autobunnyhopping 0"

// [Restart]
mp_restartgame "1"

echo "Practice config applied succesfully!"