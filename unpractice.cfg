echo "Removing practice config..."
echo ""

exec gamemode_competitive

// [Remove cheat features]
sv_infinite_ammo "0"
sv_grenade_trajectory "0"
sv_showimpacts "0"
sv_autobunnyhopping "0"
mp_buy_anywhere "0"
mp_drop_knife_enable "0"
mp_anyone_can_pickup_c4 "0"

sv_cheats "0"

// [Remove practice binds]
bind "c" "radio3"
unbind "v"
unbind "MOUSE5"

// [Remove practice aliases]
alias "disable grenade practice" ""
alias "disable spray practice" ""
alias "disable infinite ammo" ""
alias "enable bhop" ""
alias "disable bhop" ""

// [Restart]
mp_restartgame "1"

echo ""
echo "Practice config removed. Competitive defaults restored!"
